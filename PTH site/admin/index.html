<!DOCTYPE html>

            </div>
        </div>

                    <li><a href="#" data-section="gallery">গ্যালারি</a></li>
                    <li><a href="#" data-section="teachers">শিক্ষক</a></li>
                    <li><a href="#" data-section="requests">রিকোয়েস্ট</a></li>
                    <li><a href="#" data-section="settings">সেটিংস</a></li>
                    <li><a href="#" data-section="logs">লগ</a></li>
                    <li><a href="#" data-section="change-password">পাসওয়ার্ড পরিবর্তন</a></li>

            <main id="adminContent" class="admin-content"><p>লোড হচ্ছে...</p></main>
